spring.application.name=notioncall-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notioncall}
spring.datasource.username=${DB_USERNAME:notioncall}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:notioncall_dev}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
